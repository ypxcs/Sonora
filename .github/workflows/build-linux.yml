name: Build Linux Bundles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build AppImage, .deb and .rpm (x86_64)
    # Must be 24.04+: the prebuilt ONNX Runtime that ort-sys links against is
    # compiled against glibc >= 2.38 and libstdc++ >= GCC 12, which 22.04
    # (glibc 2.35 / GCC 11) cannot satisfy. See AGENTS.md.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify versions match
        run: |
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch: package=$PKG tauri=$TAURI cargo=$CARGO"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            patchelf \
            libfuse2t64

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ort-sys downloads a prebuilt ONNX Runtime at build time; cache it across runs.
      - name: Cache ONNX Runtime binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io/dfbin
          key: ort-binaries-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Download TTS model and voices
        run: ./scripts/download-models.sh

      - name: Build bundles
        run: bun tauri build --bundles deb,rpm,appimage

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sonora v${{ steps.version.outputs.version }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          generate_release_notes: true
