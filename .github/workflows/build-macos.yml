name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build .app (arm64, ad-hoc signed)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify versions match
        run: |
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch: package=$PKG tauri=$TAURI cargo=$CARGO"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Download TTS model and voices
        run: ./scripts/download-models.sh

      - name: Build app bundle
        run: bun tauri build --bundles app

      - name: Ad-hoc sign the app
        run: |
          APP="src-tauri/target/release/bundle/macos/Sonora.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Zip the .app
        run: |
          APP="src-tauri/target/release/bundle/macos/Sonora.app"
          ditto -c -k --keepParent "$APP" Sonora-macos.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sonora v${{ steps.version.outputs.version }}
          files: Sonora-macos.zip
          generate_release_notes: true
